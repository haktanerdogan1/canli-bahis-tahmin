<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Matchrix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --bg:#0E0E10;
  --surface:#18181B;
  --ink:#F4F2EC;
  --ink-soft:#9A968C;
  --accent:#3D63FF;
  --line:rgba(255,255,255,0.14);
  --shimmer:rgba(255,255,255,0.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Space Grotesk',sans-serif;
  font-size:16px;
  min-height:100vh;
  overflow-x:hidden;
  padding-bottom:80px;
  position:relative;
}
::-webkit-scrollbar{display:none;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}

/* ---------- ince teknik kilavuz izgarasi (arka plan dokusu) ---------- */
body::before{
  content:'';
  position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
  background-size:32px 32px;
}
/* ---------- grain / noise dokusu (koyu zeminde "screen" ile aciyor) ---------- */
body::after{
  content:'';
  position:fixed; inset:0; pointer-events:none; z-index:60;
  opacity:0.04; mix-blend-mode:screen;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:flex-end; justify-content:space-between;
  padding:22px 20px 14px;
  background:var(--bg);
  border-bottom:2px solid var(--ink);
}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{
  width:32px; height:32px; border-radius:0;
  background:var(--ink); color:var(--bg);
  display:flex; align-items:center; justify-content:center;
  font-family:'Syne'; font-weight:800; font-size:1.05rem;
}
.brand-text{font-family:'Syne',sans-serif; font-weight:800; font-size:1.55rem; letter-spacing:-0.5px; line-height:1;}
.brand-sub{font-size:0.6rem; color:var(--ink-soft); letter-spacing:3px; margin-top:4px; font-weight:600;}
.live-chip{display:flex; align-items:center; gap:6px; font-size:0.62rem; font-weight:700; letter-spacing:1.5px; color:var(--ink); padding-bottom:4px;}
.live-dot{width:7px;height:7px;background:var(--accent); flex:0 0 auto; animation:blink-dot 1.2s steps(2) infinite;}
@keyframes blink-dot{50%{opacity:0.15;}}

/* ---------- Ozet seridi (ticker) ---------- */
.stat-row{display:grid; grid-template-columns:1fr 1fr; border-bottom:1px solid var(--line);}
.stat-pill{min-width:0; padding:16px 18px; text-align:left; border-top:1px solid var(--line); border-right:1px solid var(--line); overflow:hidden;}
.stat-pill:nth-child(-n+2){border-top:none;}
.stat-pill:nth-child(2n){border-right:none;}
.stat-pill .v{font-family:'Syne'; font-weight:800; font-size:1.5rem; color:var(--ink); white-space:nowrap;}
.stat-pill .l{font-size:0.56rem; color:var(--ink-soft); letter-spacing:1px; margin-top:3px; text-transform:uppercase;}
.stat-pill.won .v{color:var(--accent);}
.stat-pill.lost .v{color:var(--ink); text-decoration:line-through; text-decoration-thickness:2px; text-decoration-color:var(--ink-soft);}
.stat-pill.rate .v{color:var(--accent);}

/* ---------- Tabs content ---------- */
.tab-panel{padding:0 20px; position:relative; z-index:1; display:none; opacity:0; transform:translateY(8px); transition:opacity .22s ease, transform .22s ease;}
.tab-panel.active{opacity:1; transform:translateY(0);}
.section-title{
  font-family:'Syne'; font-weight:700; font-size:0.72rem; letter-spacing:2px; color:var(--ink);
  margin:22px 0 12px; padding-bottom:8px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:8px; text-transform:uppercase;
}
.section-title i{color:var(--ink-soft); font-size:0.85em;}

/* ---------- Lig grubu ---------- */
.league-group{margin-bottom:22px;}
.league-header{
  display:flex; align-items:center; gap:8px; font-size:0.66rem; font-weight:700;
  color:var(--ink-soft); margin-bottom:10px; padding-left:8px; border-left:3px solid var(--accent);
  letter-spacing:1.5px; text-transform:uppercase;
}
.league-header img{width:14px;height:14px;border-radius:0;}

/* ---------- Kart yuzeyi (hairline, duz - camsi/gradyanli yok) ---------- */
.card-surface{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:0;
}

/* ---------- Sinyal karti (flip) ---------- */
.flip-outer{perspective:1400px; margin-bottom:14px; content-visibility:auto; contain-intrinsic-size:0 186px;}
.flip-inner{position:relative; transition:transform .5s cubic-bezier(.4,.2,.2,1); transform-style:preserve-3d; min-height:172px;}
.flip-outer.flipped .flip-inner{transform:rotateY(180deg);}
.flip-face{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; padding:16px; overflow:hidden;}
.flip-face.back{transform:rotateY(180deg); display:flex; flex-direction:column; justify-content:center;}

.card-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.badge-status{font-size:0.6rem; font-weight:700; letter-spacing:1px; padding:0; text-transform:uppercase; font-family:'Space Grotesk';}
.badge-live{color:var(--accent);}
.badge-won{color:var(--accent); border-bottom:2px solid var(--accent); padding-bottom:1px;}
.badge-lost{color:var(--ink-soft); text-decoration:line-through;}
.badge-min{font-size:0.66rem; color:var(--ink-soft); font-weight:600;}

.teams-row{display:flex; align-items:center; gap:10px;}
.team-col{flex:1; display:flex; align-items:center; gap:8px; min-width:0;}
.team-col img{width:20px;height:20px;border-radius:0;background:#fff;flex:0 0 auto; border:1px solid var(--line);}
.team-name{font-size:0.85rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.score-col{font-family:'Syne'; font-weight:800; font-size:1.25rem; padding:0 10px; color:var(--ink);}
.vs-divider{color:var(--ink-soft); font-size:0.78rem;}

.card-bottom{display:flex; align-items:center; justify-content:space-between; margin-top:14px; gap:10px; padding-top:12px; border-top:1px solid var(--line);}
.market-txt{font-size:0.76rem; color:var(--ink-soft); font-weight:600; flex:1; min-width:0;}
.bot-pill{
  display:inline-flex; align-items:center; gap:5px; font-size:0.6rem; font-weight:600;
  color:var(--ink-soft); margin-top:6px;
}

/* ---------- Olasilik gostergesi (tipografik - halka/glow yok) ---------- */
.gauge{display:flex; flex-direction:column; align-items:flex-end; gap:5px; flex:0 0 auto;}
.gauge .pctnum{font-family:'Syne'; font-weight:800; font-size:1.2rem; color:var(--ink);}
.gauge .bar{width:50px; height:3px; background:var(--line); display:block;}
.gauge .bar i{display:block; height:100%; background:var(--accent);}

/* ---------- Kilitli (paywall) kart - "REDACTED" belge dokusu ---------- */
.locked-card{
  position:relative; overflow:hidden; min-height:132px; padding:18px;
  display:flex; flex-direction:column; justify-content:center; align-items:flex-start; gap:10px; cursor:pointer;
  background:repeating-linear-gradient(135deg, rgba(255,255,255,0.06) 0 1px, transparent 1px 11px);
}
.locked-card i.fa-lock{font-size:1.05rem; color:var(--ink);}
.locked-card .lbl{font-size:0.64rem; color:var(--ink); font-weight:700; letter-spacing:1.5px; text-transform:uppercase;}
.locked-card .cta{
  font-family:'Space Grotesk'; font-size:0.64rem; font-weight:700; letter-spacing:1px; text-transform:uppercase;
  padding:9px 16px; border:1.5px solid var(--ink); color:var(--ink); margin-top:2px; border-radius:0;
}
.locked-blur-row{display:flex; gap:8px; filter:blur(3px); opacity:0.55; width:100%;}
.locked-blur-row div{height:9px; background:var(--ink-soft); width:70px;}

/* KAZANDI aninda kisa bir vurgu flasi (renkli glow ring yok) */
.celebrate{animation:celebrate-pulse 1.4s ease-out 1;}
@keyframes celebrate-pulse{
  0%{background:rgba(61,99,255,0.16);}
  100%{background:transparent;}
}

/* ---------- Bot arka yuzu ---------- */
.bot-back-head{display:flex; align-items:center; gap:12px; margin-bottom:10px;}
.bot-back-avatar{
  width:38px; height:38px; display:flex; align-items:center; justify-content:center;
  font-family:'Syne'; font-weight:800; font-size:0.85rem; flex:0 0 auto;
  border:1px solid var(--ink); color:var(--ink); border-radius:0;
}
.bot-back-name{font-family:'Syne'; font-size:0.82rem; font-weight:700;}
.bot-back-code{font-size:0.64rem; color:var(--ink-soft);}
.bot-back-desc{
  font-size:0.78rem; color:var(--ink-soft); line-height:1.45;
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
}
.flip-hint{position:absolute; bottom:10px; right:14px; font-size:0.58rem; color:var(--ink-soft); display:flex; align-items:center; gap:4px;}

/* ---------- Alt navigasyon ---------- */
.bottom-nav{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  display:flex; justify-content:space-around; align-items:center;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  background:var(--bg); border-top:2px solid var(--ink);
}
.nav-btn{
  display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:none;
  color:var(--ink-soft); font-size:0.56rem; font-weight:700; letter-spacing:0.4px; padding:6px 10px 5px;
  text-transform:uppercase; border-bottom:2px solid transparent;
}
.nav-btn i{font-size:1rem;}
.nav-btn.active{color:var(--ink); border-bottom-color:var(--accent);}

/* ---------- Bos / yukleniyor ---------- */
.empty-state{text-align:center; padding:60px 20px; color:var(--ink-soft);}
.empty-state i{font-size:2.1rem; margin-bottom:12px; opacity:0.35; color:var(--ink);}
.loader-ring{
  width:28px;height:28px;border-radius:50%; margin:40px auto;
  border:2px solid var(--line); border-top-color:var(--accent);
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- Skeleton yukleme (spinner yerine kart hatlarini taklit eden
   shimmer - algilanan hizi/kaliteyi artiriyor) ---------- */
.skeleton-card{
  height:150px; border:1px solid var(--line); margin-bottom:14px; position:relative; overflow:hidden;
}
.skeleton-card::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(100deg, transparent 30%, var(--shimmer) 48%, rgba(255,255,255,0.11) 52%, transparent 70%);
  background-size:200% 100%;
  animation:skeleton-sweep 1.5s ease-in-out infinite;
}
@keyframes skeleton-sweep{0%{background-position:160% 0;} 100%{background-position:-60% 0;}}
.skeleton-league{width:120px; height:10px; margin:0 0 10px 2px; background:rgba(255,255,255,0.06); position:relative; overflow:hidden;}
.skeleton-league::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg, transparent 30%, rgba(255,255,255,0.12) 50%, transparent 70%); background-size:200% 100%; animation:skeleton-sweep 1.5s ease-in-out infinite;}

/* ---------- Dokunma geri bildirimi (native his) ---------- */
.card-surface, .locked-card, .btn-primary, .btn-google, .btn-logout, .squad-full-item, .acc-card, .stat-pill{
  transition:transform .12s ease, opacity .12s ease;
}
.flip-face.card-surface:active, .locked-card:active{transform:scale(0.98);}
.btn-primary:active, .btn-google:active, .btn-logout:active{transform:scale(0.97); opacity:0.85;}
.squad-full-item:active{transform:scale(0.99); opacity:0.75;}
.nav-btn{transition:transform .12s ease, color .15s ease;}
.nav-btn:active{transform:scale(0.88);}
.modal-close{transition:transform .12s ease;}
.modal-close:active{transform:scale(0.85);}

/* ---------- Istatistik ekrani ---------- */
.big-stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:0; margin-bottom:22px; border-top:1px solid var(--line); border-left:1px solid var(--line);}
.big-stat{padding:20px 16px; text-align:left; border-right:1px solid var(--line); border-bottom:1px solid var(--line); min-width:0; overflow:hidden;}
.big-stat .v{font-family:'Syne'; font-weight:800; font-size:1.9rem; color:var(--ink);}
.big-stat .l{font-size:0.58rem; color:var(--ink-soft); margin-top:6px; letter-spacing:1px; text-transform:uppercase;}
.big-stat.accent .v{color:var(--accent);}

.squad-full-item{
  display:flex; align-items:center; gap:14px; padding:14px 0; margin-bottom:0; cursor:pointer;
  border-bottom:1px solid var(--line);
}
.squad-full-item.offline{opacity:0.4;}
.squad-full-avatar{
  width:38px; height:38px; display:flex; align-items:center; justify-content:center;
  font-family:'Syne'; font-weight:800; font-size:0.82rem; flex:0 0 auto; border:1px solid var(--ink); color:var(--ink);
}
.squad-full-info{flex:1; min-width:0;}
.squad-full-name{font-family:'Space Grotesk'; font-size:0.78rem; font-weight:700;}
.squad-full-desc{font-size:0.7rem; color:var(--ink-soft); margin-top:3px;}
.squad-status-tag{font-size:0.56rem; font-weight:700; letter-spacing:1px; flex:0 0 auto; text-transform:uppercase;}
.squad-status-tag.on{color:var(--accent);}
.squad-status-tag.off{color:var(--ink-soft);}

/* ---------- Hesap ---------- */
.acc-card{padding:0; margin-top:6px;}
.acc-title{font-family:'Syne'; font-size:1.5rem; font-weight:800; margin-bottom:8px; letter-spacing:-0.3px;}
.acc-sub{font-size:0.8rem; color:var(--ink-soft); margin-bottom:26px; line-height:1.45;}
.field{margin-bottom:18px;}
.field label{display:block; font-size:0.6rem; color:var(--ink-soft); margin-bottom:7px; letter-spacing:1.5px; text-transform:uppercase; font-weight:700;}
.field input{
  width:100%; padding:9px 2px; border:none; border-bottom:1.5px solid var(--ink);
  background:transparent; color:var(--ink); font-family:'Space Grotesk'; font-size:0.95rem; border-radius:0;
}
.field input:focus{outline:none; border-bottom-color:var(--accent);}
.btn-primary{
  width:100%; padding:14px; border:none; font-family:'Syne'; font-weight:700;
  font-size:0.8rem; letter-spacing:1px; text-transform:uppercase; background:var(--ink);
  color:var(--bg); border-radius:0; margin-top:6px;
}
.btn-google{
  width:100%; padding:12px; border-radius:0; margin-top:10px; text-align:center;
  border:1.5px solid var(--ink); background:transparent; font-weight:700; font-size:0.8rem;
  display:flex; align-items:center; justify-content:center; gap:8px; color:var(--ink);
}
.acc-switch{text-align:left; margin-top:20px; font-size:0.78rem; color:var(--ink-soft);}
.acc-switch b{color:var(--accent); cursor:pointer; font-weight:700;}
.err-msg{color:var(--ink); font-weight:700; font-size:0.76rem; margin-top:8px; min-height:1em;}
.logged-avatar{
  width:60px; height:60px; margin:0 0 16px; display:flex; align-items:center; justify-content:center;
  font-family:'Syne'; font-weight:800; font-size:1.3rem; background:var(--ink); color:var(--bg); border-radius:0;
}
.btn-logout{
  width:100%; padding:12px; border-radius:0; margin-top:20px; border:1.5px solid var(--ink);
  background:transparent; color:var(--ink); font-weight:700; font-size:0.8rem; text-transform:uppercase;
}

/* ---------- Modal (mac detayi) ---------- */
.modal-overlay{
  position:fixed; inset:0; z-index:50; background:rgba(0,0,0,0.65);
  display:none; align-items:flex-end; justify-content:center;
}
.modal-overlay.active{display:flex;}
.modal-sheet{
  width:100%; max-width:520px; max-height:86vh; overflow-y:auto; border-radius:0;
  background:var(--bg); border-top:2px solid var(--ink);
  padding:26px 20px calc(24px + env(safe-area-inset-bottom));
  animation:sheet-up .28s ease-out;
}
@keyframes sheet-up{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.modal-close{position:absolute; top:18px; right:20px; font-size:1.1rem; color:var(--ink);}
.modal-title{font-family:'Syne'; font-size:1.1rem; font-weight:800; margin-bottom:20px; padding-right:30px;}
.stat-bar-row{margin-bottom:16px;}
.stat-bar-labels{display:flex; justify-content:space-between; font-size:0.78rem; font-weight:700; margin-bottom:6px;}
.stat-bar-track{height:5px; background:var(--line); overflow:hidden; display:flex;}
.stat-bar-home{background:var(--accent);}
.stat-bar-away{background:var(--ink);}
.stat-cat{font-size:0.66rem; text-align:center; color:var(--ink-soft); margin-bottom:2px; letter-spacing:0.5px;}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:18px;}
.form-card{padding:14px 0 0; text-align:left; border-top:1px solid var(--line);}
.form-card .t{font-size:0.66rem; color:var(--ink-soft); margin-bottom:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase;}
.form-card .row{display:flex; justify-content:space-between; font-size:0.74rem; margin-bottom:6px;}
.form-card .row b{color:var(--accent);}

@media (min-width:600px){
  .tab-panel, .topbar, .stat-row{padding-left:32px; padding-right:32px;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-mark">M</div>
    <div>
      <div class="brand-text">MATCHRIX</div>
      <div class="brand-sub">SIGNAL GRID</div>
    </div>
  </div>
  <div class="live-chip"><span class="live-dot"></span>CANLI</div>
</div>

<!-- ================= SİNYALLER (today) ================= -->
<div class="tab-panel active" id="tab-today" style="display:block;">
  <div class="stat-row" id="statRowToday"></div>
  <div class="section-title"><i class="fa-solid fa-satellite-dish"></i> BUGÜNKÜ SİNYALLER</div>
  <div id="listToday"></div>
</div>

<!-- ================= AÇIK ================= -->
<div class="tab-panel" id="tab-open">
  <div class="section-title"><i class="fa-solid fa-crosshairs"></i> TÜM AÇIK SİNYALLER</div>
  <div id="listOpen"></div>
</div>

<!-- ================= SONUÇLAR ================= -->
<div class="tab-panel" id="tab-results">
  <div class="section-title"><i class="fa-solid fa-flag-checkered"></i> BUGÜNÜN SONUÇLARI</div>
  <div id="listResults"></div>
</div>

<!-- ================= İSTATİSTİK ================= -->
<div class="tab-panel" id="tab-stats">
  <div class="section-title"><i class="fa-solid fa-chart-line"></i> PERFORMANS</div>
  <div class="big-stat-grid" id="bigStatGrid"></div>
  <div class="section-title"><i class="fa-solid fa-users-viewfinder"></i> CYBER SQUAD — TAM KADRO</div>
  <div id="squadFullList"></div>
</div>

<!-- ================= HESAP ================= -->
<div class="tab-panel" id="tab-account">
  <div id="accountArea"></div>
</div>

<div class="bottom-nav">
  <button class="nav-btn active" data-tab="today" onclick="switchTab('today')"><i class="fa-solid fa-bolt"></i>Bugün</button>
  <button class="nav-btn" data-tab="open" onclick="switchTab('open')"><i class="fa-solid fa-crosshairs"></i>Açık</button>
  <button class="nav-btn" data-tab="results" onclick="switchTab('results')"><i class="fa-solid fa-flag-checkered"></i>Sonuç</button>
  <button class="nav-btn" data-tab="stats" onclick="switchTab('stats')"><i class="fa-solid fa-chart-line"></i>İstatistik</button>
  <button class="nav-btn" data-tab="account" onclick="switchTab('account')"><i class="fa-solid fa-user-astronaut"></i>Hesap</button>
</div>

<div class="modal-overlay" id="matchModal">
  <div class="modal-sheet">
    <span class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></span>
    <div class="modal-title" id="modalTitle">—</div>
    <div id="modalBody"><div class="loader-ring"></div></div>
  </div>
</div>

<div class="modal-overlay" id="botModal" onclick="if(event.target===this) closeBotModal();">
  <div class="modal-sheet" style="max-width:420px;">
    <span class="modal-close" onclick="closeBotModal()"><i class="fa-solid fa-xmark"></i></span>
    <div id="botModalBody"></div>
  </div>
</div>

<script>
// ======================================================================
// GERÇEK 18 BOT — bot_* id'leri app/core/consensus_engine.py ile 1:1 aynı.
// ======================================================================

// STATE

let isMember = false;
let currentTab = 'today';
let todayTR = null;
let authMode = 'login';

function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab-panel').forEach(p=>{
    if(p.id === 'tab-'+tab){
      p.style.display = 'block';
      setTimeout(()=> p.classList.add('active'), 10);
    } else if(p.classList.contains('active')){
      p.classList.remove('active');
      setTimeout(()=>{ if(!p.classList.contains('active')) p.style.display = 'none'; }, 220);
    } else {
      p.style.display = 'none';
    }
  });
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  if(tab==='account') renderAccount();
  if(tab==='stats') loadStats();
  loadSignals();
}

// API helpers

async function api(path, opts){
  const res = await fetch(path, Object.assign({credentials:'same-origin'}, opts||{}));
  return res.json();
}

// ======================================================================
// SİNYAL LİSTESİ
// ======================================================================
let allMatches = [];

let _signalsFailStreak = 0;
async function loadSignals(){
  try{
    const result = await api('/api/live-matches');
    if(!result.success) throw new Error('api-not-success');
    _signalsFailStreak = 0;
    isMember = result.is_member;
    todayTR = result.today_tr || todayTR;
    allMatches = result.data || [];
    renderCurrentTabList();
  }catch(e){
    // Tek seferlik takilma/blip'te skeleton'u bozma; art arda 2 basarisiz
    // denemeden sonra (hala skeleton gosteren sekmelerde) baglanti hatasi goster.
    _signalsFailStreak++;
    if(_signalsFailStreak >= 2){
      ['listToday','listOpen','listResults'].forEach(id=>{
        const el = document.getElementById(id);
        if(el && el.querySelector('.skeleton-card')){
          el.innerHTML = `<div class="empty-state"><i class="fa-solid fa-satellite-dish"></i><div>Bağlantı kurulamadı, yeniden deneniyor…</div></div>`;
        }
      });
    }
  }
}

function renderCurrentTabList(){
  if(currentTab === 'today'){
    const data = allMatches.filter(m => m.outcome==='PENDING' && m.signal_date===todayTR);
    renderList('listToday', data);
  } else if(currentTab === 'open'){
    const data = allMatches.filter(m => m.outcome==='PENDING');
    renderList('listOpen', data);
  } else if(currentTab === 'results'){
    const data = allMatches.filter(m => ['WON','LOST'].includes(m.outcome) && m.signal_date===todayTR);
    renderList('listResults', data);
  }
}

function groupByLeague(matches){
  const groups = {};
  matches.forEach(m=>{
    const key = m.league_name || 'Gizli Sinyaller';
    (groups[key] = groups[key] || []).push(m);
  });
  return groups;
}

// Ayni veriyle DOM'u tekrar tekrar yeniden kurmak (12sn'de bir) hem gereksiz
// islem yukuydu hem de acik olan kartlarin cevrili durumunu her seferinde
// sifirliyordu. Onceki dongude gonderilen veriyle imza karsilastirip
// gercekten degisiklik yoksa DOM'a hic dokunmuyoruz.
const _lastListSignature = {};
function renderList(containerId, data){
  const signature = JSON.stringify(data);
  if(_lastListSignature[containerId] === signature) return;
  _lastListSignature[containerId] = signature;

  const el = document.getElementById(containerId);
  if(!data.length){
    el.innerHTML = `<div class="empty-state"><i class="fa-solid fa-satellite"></i><div>Şu an gösterilecek sinyal yok</div></div>`;
    return;
  }
  const groups = groupByLeague(data);
  let html = '';
  Object.keys(groups).forEach(league=>{
    const items = groups[league];
    const logo = items[0].league_logo;
    html += `<div class="league-group">
      <div class="league-header">${logo?`<img src="${logo}" loading="lazy" decoding="async">`:'<i class="fa-solid fa-trophy"></i>'} ${league}</div>`;
    items.forEach(m => { html += m.locked ? lockedCardHtml(m) : signalCardHtml(m); });
    html += `</div>`;
  });
  el.innerHTML = html;
}

function lockedCardHtml(m){
  return `
  <div class="card-surface locked-card" onclick="switchTab('account')">
    <i class="fa-solid fa-lock"></i>
    <div class="locked-blur-row"><div></div><div style="width:24px;"></div><div></div></div>
    <div class="lbl">SİNYAL ŞİFRELİ</div>
    <div class="cta">GÖRMEK İÇİN ÜYE OL</div>
  </div>`;
}

let cardSeq = 0;
function signalCardHtml(m){
  const id = 'card_' + (cardSeq++);
  const bot = BOT_MAP[m.lead_bot];
  const pct = Math.round((m.probability||0)*100);

  let statusBadge, timeLabel;
  if(m.outcome==='WON'){ statusBadge = `<span class="badge-status badge-won"><i class="fa-solid fa-check"></i> KAZANDI</span>`; }
  else if(m.outcome==='LOST'){ statusBadge = `<span class="badge-status badge-lost"><i class="fa-solid fa-xmark"></i> KAYBETTİ</span>`; }
  else { statusBadge = `<span class="badge-status badge-live"><span class="live-dot" style="display:inline-block;"></span> CANLI</span>`; }

  if(m.match_status==='FINISHED') timeLabel='MS';
  else if(m.match_status==='HT') timeLabel='İY';
  else if(m.match_status==='ABANDONED') timeLabel='GD';
  else timeLabel = (m.minute>=0? m.minute+"'" : '—');

  const botPill = bot ? `<div class="bot-pill">${botIconHtml(bot,'0.7rem')} ${bot.name}</div>` : '';

  const celebrateClass = m.outcome==='WON' ? 'celebrate' : '';

  return `
  <div class="flip-outer" id="${id}">
    <div class="flip-inner">
      <div class="flip-face front card-surface ${celebrateClass}" onclick="toggleFlip('${id}')">
        <div class="card-top">
          ${statusBadge}
          <span class="badge-min">${timeLabel}</span>
        </div>
        <div class="teams-row">
          <div class="team-col">
            ${m.home_logo?`<img src="${m.home_logo}" loading="lazy" decoding="async" onerror="this.style.display='none'">`:''}
            <span class="team-name">${m.home_team||''}</span>
          </div>
          <div class="score-col">${m.home_score ?? '-'}<span class="vs-divider"> : </span>${m.away_score ?? '-'}</div>
          <div class="team-col" style="justify-content:flex-end; text-align:right;">
            <span class="team-name">${m.away_team||''}</span>
            ${m.away_logo?`<img src="${m.away_logo}" loading="lazy" decoding="async" onerror="this.style.display='none'">`:''}
          </div>
        </div>
        <div class="card-bottom">
          <div>
            <div class="market-txt">${m.market||''}</div>
            ${botPill}
          </div>
          <div class="gauge"><span class="pctnum">${pct}%</span><span class="bar"><i style="width:${pct}%"></i></span></div>
        </div>
      </div>
      <div class="flip-face back card-surface" onclick="toggleFlip('${id}')">
        ${bot ? `
          <div class="bot-back-head">
            <div class="bot-back-avatar">${botIconHtml(bot,'1.05rem')}</div>
            <div>
              <div class="bot-back-name">${bot.name}</div>
              <div class="bot-back-code">// ${bot.code} — en çok katkı veren birim</div>
            </div>
          </div>
          <div class="bot-back-desc">${bot.desc}</div>
        ` : `<div class="bot-back-desc">Bu sinyal, konsensüs ekibinin ortak kararıyla üretildi.</div>`}
        <div style="font-size:0.78rem; color:var(--ink-soft); margin-top:8px;">Sinyal dakikası: <b style="color:var(--accent)">${m.signal_minute ?? '—'}'</b></div>
        ${m.match_id && isMember ? `<button class="btn-primary" style="margin-top:12px;" onclick="event.stopPropagation(); openMatchDetail(${m.match_id}, '${(m.home_team||'').replace(/'/g,"")}', '${(m.away_team||'').replace(/'/g,"")}')"><i class="fa-solid fa-satellite-dish"></i> CANLI ANALİZİ AÇ</button>` : ''}
        <div class="flip-hint"><i class="fa-solid fa-rotate"></i> çevir</div>
      </div>
    </div>
  </div>`;
}

function toggleFlip(id){
  document.getElementById(id).classList.toggle('flipped');
}

function skeletonListHtml(n){
  let html = '<div class="skeleton-league"></div>';
  for(let i=0;i<(n||3);i++) html += '<div class="card-surface skeleton-card"></div>';
  return html;
}

let _lastOzetSignature = null;
async function loadOzetStrip(){
  try{
    const d = await api('/api/ozet');
    if(!d.success) return;
    const sig = JSON.stringify(d);
    if(sig === _lastOzetSignature) return;
    _lastOzetSignature = sig;
    document.getElementById('statRowToday').innerHTML = `
      <div class="stat-pill won"><div class="v">${d.bugun_kazanan}</div><div class="l">BUGÜN KAZANAN</div></div>
      <div class="stat-pill lost"><div class="v">${d.bugun_kaybeden}</div><div class="l">BUGÜN KAYBEDEN</div></div>
      <div class="stat-pill rate"><div class="v">${d.isabet_orani!=null ? Math.round(d.isabet_orani*100)+'%' : '—'}</div><div class="l">GENEL İSABET</div></div>
      <div class="stat-pill"><div class="v">${d.bekleyen}</div><div class="l">CANLI TAKİP</div></div>
    `;
    document.getElementById('bigStatGrid').innerHTML = `
      <div class="big-stat accent"><div class="v">${d.sonuclanan}</div><div class="l">TOPLAM SONUÇLANAN</div></div>
      <div class="big-stat accent"><div class="v">${d.isabet_orani!=null ? Math.round(d.isabet_orani*100)+'%' : '—'}</div><div class="l">İSABET ORANI</div></div>
      <div class="big-stat"><div class="v">${d.kazanan}</div><div class="l">KAZANAN</div></div>
      <div class="big-stat"><div class="v" style="text-decoration:line-through; text-decoration-color:var(--ink-soft);">${d.kaybeden}</div><div class="l">KAYBEDEN</div></div>
    `;
  }catch(e){}
}
function loadStats(){ loadOzetStrip(); renderSquadFull(); }

// ======================================================================
// MAÇ DETAY MODALI
// ======================================================================
async function openMatchDetail(matchId, home, away){
  document.getElementById('matchModal').classList.add('active');
  document.getElementById('modalTitle').textContent = `${home} — ${away}`;
  document.getElementById('modalBody').innerHTML = '<div class="loader-ring"></div>';
  try{
    const r = await api('/api/match/'+matchId);
    if(!r.success){
      document.getElementById('modalBody').innerHTML = `<div class="empty-state"><i class="fa-solid fa-lock"></i><div>${r.error||'Görüntülenemedi'}</div></div>`;
      return;
    }
    const d = r.data;
    const ls = d.live_stats || {};
    const bar = (label, h, a, suffix) => {
      const total = (h+a) || 1;
      const hp = (h/total)*100;
      return `<div class="stat-bar-row">
        <div class="stat-bar-labels"><span>${h}${suffix||''}</span><span style="color:var(--ink-soft); font-weight:600;">${label}</span><span>${a}${suffix||''}</span></div>
        <div class="stat-bar-track"><div class="stat-bar-home" style="width:${hp}%"></div><div class="stat-bar-away" style="width:${100-hp}%"></div></div>
      </div>`;
    };
    document.getElementById('modalBody').innerHTML = `
      ${bar('Top Hakimiyeti', ls.possession?.home||0, ls.possession?.away||0, '%')}
      ${bar('xG', (ls.xg?.home||0).toFixed(2), (ls.xg?.away||0).toFixed(2), '')}
      ${bar('Şut', ls.shots?.home||0, ls.shots?.away||0, '')}
      ${bar('İsabetli Şut', ls.shots_target?.home||0, ls.shots_target?.away||0, '')}
      ${bar('Korner', ls.corners?.home||0, ls.corners?.away||0, '')}
      <div class="form-grid">
        <div class="form-card">
          <div class="t">${home} — FORM</div>
          <div class="row"><span>İY Gol Oranı</span><b>${d.home_form.fh_goal_rate}</b></div>
          <div class="row"><span>Maç Başı Gol</span><b>${d.home_form.avg_goals_scored}</b></div>
        </div>
        <div class="form-card">
          <div class="t">${away} — FORM</div>
          <div class="row"><span>İY Gol Oranı</span><b>${d.away_form.fh_goal_rate}</b></div>
          <div class="row"><span>Maç Başı Gol</span><b>${d.away_form.avg_goals_scored}</b></div>
        </div>
      </div>
    `;
  }catch(e){
    document.getElementById('modalBody').innerHTML = `<div class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i><div>Veri çekilemedi</div></div>`;
  }
}
function closeModal(){ document.getElementById('matchModal').classList.remove('active'); }

// ======================================================================
// HESAP / AUTH
// ======================================================================
async function checkAuth(){
  try{
    const d = await api('/api/me');
    isMember = !!d.authenticated;
    if(currentTab==='account') renderAccount();
  }catch(e){}
}

function renderAccount(){
  const el = document.getElementById('accountArea');
  if(isMember){
    api('/api/me').then(d=>{
      el.innerHTML = `
        <div class="acc-card">
          <div class="logged-avatar">${(d.email||'?')[0].toUpperCase()}</div>
          <div class="acc-title">Hoş geldin, Operatör</div>
          <div class="acc-sub">${d.email}</div>
          <div class="btn-logout" onclick="logout()"><i class="fa-solid fa-power-off"></i> Oturumu Kapat</div>
        </div>`;
    });
    return;
  }
  el.innerHTML = `
    <div class="acc-card">
      <div class="acc-title">${authMode==='login' ? 'Giriş Yap' : 'Üye Ol'}</div>
      <div class="acc-sub">Tüm aktif sinyallere ve canlı analize erişmek için hesabına bağlan.</div>
      <div class="field"><label>E-POSTA</label><input type="email" id="authEmail" placeholder="ornek@mail.com"></div>
      <div class="field"><label>ŞİFRE</label><input type="password" id="authPass" placeholder="••••••••"></div>
      <button class="btn-primary" onclick="doAuth()">${authMode==='login' ? 'GİRİŞ YAP' : 'HESAP OLUŞTUR'}</button>
      <a class="btn-google" href="/api/auth/google/login"><i class="fa-brands fa-google"></i> Google ile devam et</a>
      <div class="err-msg" id="authErr"></div>
      <div class="acc-switch">
        ${authMode==='login' ? `Hesabın yok mu? <b onclick="authMode='register'; renderAccount();">Üye ol</b>` : `Zaten üye misin? <b onclick="authMode='login'; renderAccount();">Giriş yap</b>`}
      </div>
    </div>`;
}

async function doAuth(){
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPass').value;
  const errEl = document.getElementById('authErr');
  errEl.textContent = '';
  try{
    const d = await api(authMode==='login' ? '/api/login' : '/api/register', {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email, password})
    });
    if(!d.success){ errEl.textContent = d.error || 'Bir hata oluştu.'; return; }
    isMember = true;
    renderAccount();
    loadSignals();
  }catch(e){ errEl.textContent = 'Bağlantı hatası.'; }
}

async function logout(){
  await api('/api/logout', {method:'POST'});
  isMember = false;
  authMode = 'login';
  renderAccount();
  loadSignals();
}

// INIT — sekme arka plandayken (kullanici uygulamadan cikip baska bir
// uygulamaya gectiginde) polling'i durduruyoruz; hem gereksiz pil/veri
// tuketimini onluyor hem de geri donuldugunde tazeleniyor.

document.getElementById('listToday').innerHTML = skeletonListHtml(3);
document.getElementById('listOpen').innerHTML = skeletonListHtml(4);
document.getElementById('listResults').innerHTML = skeletonListHtml(3);
document.getElementById('bigStatGrid').innerHTML = '<div class="big-stat skeleton-card" style="height:70px; border:1px solid var(--line);"></div>'.repeat(4);

checkAuth();
loadOzetStrip();
loadSignals();
let signalsTimer = setInterval(loadSignals, 12000);
let ozetTimer = setInterval(loadOzetStrip, 30000);

document.addEventListener('visibilitychange', () => {
  if(document.hidden){
    clearInterval(signalsTimer);
    clearInterval(ozetTimer);
  } else {
    loadSignals();
    loadOzetStrip();
    signalsTimer = setInterval(loadSignals, 12000);
    ozetTimer = setInterval(loadOzetStrip, 30000);
  }
});
